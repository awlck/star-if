name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so pushes don't queue behind
# their own stale predecessors.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # backlog B6: can run before any C++ exists, and is the thing that
  # actually keeps docs/stardata-spec.md and tests/corpus/ from silently
  # diverging in the meantime.
  stardata-checker:
    name: Stardata conformance checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/check_stardata.py --check-docs --self-test --strict

  # backlog B2: the libs/knows-nothing-about-Qt boundary, asserted rather
  # than assumed.
  no-qt-in-libs:
    name: libs/ has no Qt dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_no_qt_in_libs.py

  # proposal §2.1.1's grep test: libs/stardata implements the format and the
  # schema mechanism, libs/starcore the vocabulary expressed in it. §2.1.1
  # asks for this as a CI check for the same reason spec §7.2.2 insists core
  # assert rather than hope -- a boundary nobody verifies is one that erodes,
  # and this one had already eroded once.
  layering:
    name: stardata names no core vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_layering.py

  # spec §7.2.4's format forms are stated twice -- as data in format.star, so
  # that documentation and editor generation have §7.1's one source, and as
  # C++ in the reader that parses them. Two statements of one thing drift, and
  # this one did: `class` declared a `traits` key nothing read for nine tasks.
  format-forms:
    name: Format forms agree with their readers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_format_forms.py

  # Section numbers cited from the code are positional, so a specification
  # edit can renumber them out from under a comment or a diagnostic without
  # anything failing to compile.
  spec-refs:
    name: Specification references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_spec_refs.py

  # backlog B4/B5: the format check.
  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(git ls-files -- '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' '*.hh')
          if [ -z "$files" ]; then
            echo "no C++ files yet"
            exit 0
          fi
          clang-format --dry-run --Werror $files

      # catch_discover_tests registers each TEST_CASE by name and CTest hands
      # that name back to the binary as a command-line argument. On Windows
      # that round trip goes through the active code page, so a non-ASCII
      # character in a name arrives mangled, matches no test, and fails the
      # run -- on the Windows legs only, with a message ("No test cases
      # matched") that says nothing about encoding. Keep the names ASCII;
      # section markers belong in comments and INFO strings, which never
      # travel through argv.
      - name: Test-case names are ASCII
        run: |
          if git grep -nP 'TEST_CASE\("[^"]*[^\x00-\x7F]' -- '*.cpp'; then
            echo "::error::TEST_CASE names must be ASCII (CTest passes them as argv, which mangles non-ASCII on Windows)"
            exit 1
          fi

  # backlog B5: {Windows, macOS, Linux} x {Debug, Release}, each via its
  # CMakePresets.json workflow preset (backlog B1) so CI runs exactly the
  # command a contributor would run locally. The Debug legs on Linux and
  # macOS are also "the sanitiser build" from B5's checklist -- ASan/UBSan
  # turn on automatically for Debug + non-MSVC (cmake/Sanitizers.cmake), so
  # there is no separate sanitiser job to keep in sync with this one.
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-debug
          - os: ubuntu-latest
            preset: linux-gcc-release
          - os: ubuntu-latest
            preset: linux-clang-debug
          - os: ubuntu-latest
            preset: linux-clang-release
          - os: macos-latest
            preset: macos-clang-debug
          - os: macos-latest
            preset: macos-clang-release
          - os: windows-latest
            preset: windows-msvc-debug
          - os: windows-latest
            preset: windows-msvc-release
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: a2b75031b909a2d6b051725c3909230c72d4bd4a

      - name: cmake --workflow
        run: cmake --workflow --preset ${{ matrix.preset }}
